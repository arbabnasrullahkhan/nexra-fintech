<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NEXRA | Smart Earning Ecosystem</title>
    <meta name="description" content="Join NEXRA, the world's most secure fintech ecosystem.">
    <meta name="theme-color" content="#09090b">
    
    <!-- Apple Mobile Web App Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Preload Critical Assets for Instant Rendering -->
    <link rel="icon" type="image/png" href="assets/ui/favicon.png">
    <link rel="preload" as="image" href="assets/ui/logo.png" fetchpriority="high">
    <link rel="preload" as="image" href="assets/ui/title-text.png" fetchpriority="high">
    <link rel="preload" as="image" href="assets/ui/watermark.png" fetchpriority="low">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #09090b;
            --grid-color: rgba(255, 255, 255, 0.015);
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --text-muted: #52525b;
            --loader-bg: rgba(255, 255, 255, 0.08);
            --loader-fill: #ffffff;
            --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Base Resets & Mobile App Feel */
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        html, body {
            width: 100%; height: 100dvh; 
            overflow: hidden !important;
            position: fixed;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.03) 0%, transparent 65%),
                radial-gradient(circle at 50% 85%, rgba(255, 255, 255, 0.01) 0%, transparent 45%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            touch-action: none; 
            user-select: none;
            -webkit-user-drag: none;
            display: flex; justify-content: center; align-items: center;
        }

        /* Subtle Floating Brand Watermark */
        .brand-watermark {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.015;
            pointer-events: none;
            z-index: 2;
            mix-blend-mode: overlay;
        }

        /* Grid Background Overlay */
        .bg-layer {
            position: absolute; inset: 0; z-index: 3;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center;
            mask-image: radial-gradient(circle at 50% 50%, black, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at 50% 50%, black, transparent 80%);
            pointer-events: none;
        }

        /* Main App Shell Layout */
        .splash-shell {
            position: relative; z-index: 10;
            width: 100%; max-width: 420px;
            height: 100%; display: flex;
            flex-direction: column; justify-content: space-between;
            align-items: center; padding: 12dvh 30px;
            transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Branding Group with Backlight Glow */
        .brand-group { 
            flex: 1; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; gap: 28px; 
            width: 100%;
        }

        .logo-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Smooth Backlight Ring to amplify brand focus and premium trust design */
        .logo-glow {
            position: absolute;
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(12px);
            animation: pulseGlow 4s infinite ease-in-out;
            pointer-events: none;
        }

        /* Hardware Accelerated Animations */
        .logo-main { 
            width: 95px; height: 95px; object-fit: contain; 
            position: relative; z-index: 5;
            transform: translateZ(0);
            will-change: transform, opacity;
            animation: bounceIn 1.1s var(--ease-spring) forwards; 
        }

        .name-img { 
            width: 185px; height: auto; object-fit: contain; 
            transform: translateY(18px); opacity: 0;
            will-change: transform, opacity;
            animation: fadeUp 0.8s var(--ease-spring) 0.35s forwards; 
        }

        .tagline { 
            font-size: 11px; font-weight: 600; 
            letter-spacing: 0.4em; text-transform: uppercase; 
            color: var(--text-secondary); margin-top: -8px; 
            transform: translateY(18px); opacity: 0;
            will-change: transform, opacity;
            animation: fadeUp 0.8s var(--ease-spring) 0.55s forwards; 
            text-align: center;
            width: 100%;
        }

        /* Loader & Footer Group */
        .loader-group { 
            display: flex; flex-direction: column; 
            align-items: center; gap: 28px; 
            width: 100%;
        }

        /* Refined glassmorphic kinetic track loader */
        .battery-loader { 
            display: flex; gap: 8px; align-items: flex-end; 
            height: 28px; 
            padding: 5px 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* Optimized Loader using scaleY instead of height for 60fps */
        .battery-bar { 
            width: 7px; height: 18px; 
            background: var(--loader-bg); 
            border-radius: 2.5px; 
            transform-origin: bottom;
            transform: scaleY(0.4);
            will-change: transform, background-color, box-shadow;
            animation: batteryBounce 1.4s infinite cubic-bezier(0.4, 0, 0.2, 1); 
        }
        
        .battery-bar:nth-child(2) { animation-delay: 0.15s; }
        .battery-bar:nth-child(3) { animation-delay: 0.3s; }
        .battery-bar:nth-child(4) { animation-delay: 0.45s; }

        .footer-credit { 
            font-size: 11px; color: var(--text-muted); font-weight: 600; 
            letter-spacing: 1.5px; text-transform: uppercase;
            display: flex; align-items: center; gap: 8px;
        }

        .footer-credit::before {
            content: '';
            display: inline-block;
            width: 4px; height: 4px;
            background-color: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
        }

        /* Animation Keyframes */
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.15); opacity: 0.95; }
        }

        @keyframes bounceIn { 
            0% { opacity: 0; transform: scale(0.8) translateZ(0); filter: blur(5px); } 
            100% { opacity: 1; transform: scale(1) translateZ(0); filter: none; } 
        }
        
        @keyframes fadeUp { 
            from { opacity: 0; transform: translateY(18px) translateZ(0); filter: blur(3px); } 
            to { opacity: 1; transform: translateY(0) translateZ(0); filter: none; } 
        }
        
        @keyframes batteryBounce { 
            0%, 100% { transform: scaleY(0.4); background: var(--loader-bg); box-shadow: none; } 
            50% { transform: scaleY(1.1); background: var(--loader-fill); box-shadow: 0 0 12px rgba(255, 255, 255, 0.35); } 
        }

        /* Smooth Cinematic Exit Transition */
        .exit-effect { 
            opacity: 0; 
            transform: scale(1.05); 
            filter: blur(15px); 
            pointer-events: none;
        }

        /* Accessibility: Reduce Motion Support */
        @media (prefers-reduced-motion: reduce) {
            .logo-main, .name-img, .tagline { animation: none; opacity: 1; transform: none; }
            .logo-glow { display: none; }
            .battery-bar { animation: none; transform: scaleY(1); background: var(--loader-fill); }
            .exit-effect { filter: none; transform: none; }
        }
    </style>
</head>
<body>

    <img src="assets/ui/watermark.png" class="brand-watermark" alt="" aria-hidden="true">
    <div class="bg-layer" aria-hidden="true"></div>

    <main class="splash-shell" id="app-shell" aria-live="polite">
        <header class="brand-group">
            <div class="logo-container">
                <div class="logo-glow" aria-hidden="true"></div>
                <img src="assets/ui/logo.png" alt="NEXRA Logo" class="logo-main" loading="eager" decoding="async">
            </div>
            <img src="assets/ui/title-text.png" alt="NEXRA" class="name-img" loading="eager" decoding="async">
            <h1 class="tagline">Smart Earning Ecosystem</h1>
        </header>

        <footer class="loader-group">
            <div class="battery-loader" aria-label="Loading application">
                <div class="battery-bar"></div>
                <div class="battery-bar"></div>
                <div class="battery-bar"></div>
                <div class="battery-bar"></div>
            </div>
            <p class="footer-credit">Powered by NEXRA Community</p>
        </footer>
    </main>

    <script type="module">
        import { db, doc, getDoc, auth, onAuthStateChanged } from "./assets/js/firebase-config.js";

        // Global variables to pre-warm the auth state
        let capturedUser = null;
        let isAuthResolved = false;

        // 1. Initialize Auth Listener IMMEDIATELY to prevent lag after splash screen
        const unsubscribeAuth = onAuthStateChanged(auth, (user) => {
            capturedUser = user;
            isAuthResolved = true;
        });

        async function initializeNEXRA() {
            const shell = document.getElementById('app-shell');
            const SPLASH_MIN_TIME = 2800; // Optimal viewing time
            const EXIT_ANIMATION_TIME = 700; // Matches CSS transition time
            
            try {
                // 2. Parallel Loading: Check maintenance while waiting for auth
                const settingsSnap = await getDoc(doc(db, "settings", "app"));
                const isMaintenance = settingsSnap.exists() ? settingsSnap.data().maintenance : false;

                // 3. Trigger Exit and Route
                setTimeout(() => {
                    shell.classList.add('exit-effect');

                    setTimeout(() => {
                        unsubscribeAuth(); // Clean up observer for performance

                        if (isMaintenance) {
                            window.location.replace('auth/checkpoint.html');
                            return;
                        }

                        // Helper to execute routing
                        const executeRouting = (user) => {
                            if (user) {
                                window.location.replace('auth/checkpoint.html');
                            } else {
                                const hasVisited = localStorage.getItem('nexra_onboarded');
                                if (!hasVisited) {
                                    localStorage.setItem('nexra_onboarded', 'true');
                                    window.location.replace('intro.html');
                                } else {
                                    window.location.replace('auth/login.html');
                                }
                            }
                        };

                        // 4. Instant Route based on pre-warmed auth state
                        if (isAuthResolved) {
                            executeRouting(capturedUser);
                        } else {
                            // Fallback just in case network is exceptionally slow
                            onAuthStateChanged(auth, executeRouting);
                        }

                    }, EXIT_ANIMATION_TIME);
                }, SPLASH_MIN_TIME);

            } catch (error) {
                console.error("System Boot Failure:", error);
                // Safe Fallback if Firestore fails (e.g., offline)
                setTimeout(() => {
                    shell.classList.add('exit-effect');
                    setTimeout(() => window.location.replace('auth/login.html'), EXIT_ANIMATION_TIME);
                }, SPLASH_MIN_TIME);
            }
        }

        // Initialize exactly when DOM is ready
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initializeNEXRA);
        } else {
            initializeNEXRA();
        }
    </script>
</body>
</html>
