<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- SEO & Metadata -->
    <title>NEXRA | Smart Earning Ecosystem</title>
    <meta name="description" content="Join NEXRA, the world's most secure and advanced fintech earning ecosystem. Experience seamless digital asset growth.">
    <meta name="keywords" content="NEXRA, Fintech, Smart Earning, Ecosystem, Crypto, Finance, Web3">
    <meta name="author" content="NEXRA Ecosystem">
    
    <!-- Open Graph / Social -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="NEXRA | Smart Earning Ecosystem">
    <meta property="og:description" content="Join NEXRA, the world's most secure and advanced fintech earning ecosystem.">
    <meta property="og:site_name" content="NEXRA">
    
    <!-- Theme & Apple Mobile Web App -->
    <meta name="theme-color" content="#030305">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NEXRA">
    <meta name="format-detection" content="telephone=no">

    <!-- Preload Critical Assets for Instant Rendering -->
    <link rel="icon" type="image/png" href="assets/ui/favicon.png">
    <link rel="preload" as="image" href="assets/ui/logo.png" fetchpriority="high">
    <link rel="preload" as="image" href="assets/ui/title-text.png" fetchpriority="high">
    <link rel="preload" as="image" href="assets/ui/watermark.png" fetchpriority="low">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Comprehensive Premium Design System -->
    <style>
        /* ==========================================================================
           1. DESIGN SYSTEM & CSS VARIABLES
           ========================================================================== */
        :root {
            /* Color Palette - Deep Cyber Fintech */
            --nx-bg-base: #030305;
            --nx-bg-surface: #0a0a0f;
            --nx-bg-surface-elevated: #12121a;
            
            /* Typography Colors */
            --nx-text-primary: #ffffff;
            --nx-text-secondary: #a1a1aa;
            --nx-text-tertiary: #52525b;
            --nx-text-accent: #e4e4e7;
            
            /* Accents & UI */
            --nx-accent-glow: rgba(255, 255, 255, 0.08);
            --nx-accent-border: rgba(255, 255, 255, 0.05);
            --nx-accent-border-strong: rgba(255, 255, 255, 0.12);
            --nx-loader-fill: #ffffff;
            --nx-loader-bg: rgba(255, 255, 255, 0.1);
            
            /* Status Colors */
            --nx-error: #ef4444;
            --nx-error-bg: rgba(239, 68, 68, 0.1);
            --nx-warning: #f59e0b;
            
            /* Typography Specs */
            --nx-font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --nx-font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
            
            /* Motion & Easing Curves */
            --nx-ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.1);
            --nx-ease-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
            --nx-ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
            --nx-ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
            
            /* Layout & Spacing */
            --nx-safe-top: env(safe-area-inset-top, 20px);
            --nx-safe-bottom: env(safe-area-inset-bottom, 20px);
            --nx-max-width: 480px;
            
            /* Z-Index Hierarchy */
            --z-bg: 0;
            --z-grid: 1;
            --z-noise: 2;
            --z-watermark: 3;
            --z-content: 10;
            --z-overlay: 50;
            --z-modal: 100;
        }

        /* ==========================================================================
           2. BASE RESETS & NORMALIZATION
           ========================================================================== */
        *, *::before, *::after { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        html, body {
            width: 100%; 
            height: 100%;
            height: 100dvh; /* Dynamic viewport height for modern mobile browsers */
            overflow: hidden !important;
            position: fixed;
            background-color: var(--nx-bg-base);
            font-family: var(--nx-font-sans);
            color: var(--nx-text-primary);
            touch-action: none; 
            user-select: none;
            -webkit-user-drag: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overscroll-behavior: none;
        }

        /* ==========================================================================
           3. BACKGROUND, AMBIANCE & NOISE ENGINE
           ========================================================================== */
        
        /* Central Radial Illumination */
        .ambient-core {
            position: absolute;
            inset: 0;
            z-index: var(--z-bg);
            background-image: 
                radial-gradient(ellipse at 50% 35%, rgba(255, 255, 255, 0.04) 0%, transparent 55%),
                radial-gradient(circle at 50% 90%, rgba(255, 255, 255, 0.015) 0%, transparent 40%);
            pointer-events: none;
        }

        /* Subtle Cinematic Grain/Noise */
        .noise-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: var(--z-noise);
            opacity: 0.035;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }

        /* High-Tech Grid Floor */
        .grid-layer {
            position: absolute;
            inset: -50% -50%;
            width: 200%;
            height: 200%;
            z-index: var(--z-grid);
            background-image: 
                linear-gradient(var(--nx-accent-border) 1px, transparent 1px),
                linear-gradient(90deg, var(--nx-accent-border) 1px, transparent 1px);
            background-size: 60px 60px;
            background-position: center;
            transform: perspective(600px) rotateX(75deg) translateY(100px) translateZ(-200px);
            mask-image: radial-gradient(ellipse at center, black 10%, transparent 60%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 10%, transparent 60%);
            pointer-events: none;
            opacity: 0.6;
        }

        /* Faded Brand Watermark */
        .brand-watermark {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.015;
            pointer-events: none;
            z-index: var(--z-watermark);
            mix-blend-mode: screen;
            filter: grayscale(100%) contrast(150%);
        }

        /* ==========================================================================
           4. MAIN LAYOUT SHELL
           ========================================================================== */
        .app-shell {
            position: relative;
            z-index: var(--z-content);
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            transition: all 0.9s var(--nx-ease-cinematic);
        }

        .shell-container {
            width: 100%;
            max-width: var(--nx-max-width);
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: calc(var(--nx-safe-top) + 6vh) 32px calc(var(--nx-safe-bottom) + 5vh);
            position: relative;
        }

        /* ==========================================================================
           5. BRANDING PRESENTATION
           ========================================================================== */
        .brand-header {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 32px;
            width: 100%;
            position: relative;
            transform: translateY(-2dvh);
        }

        /* Logo Anatomy */
        .logo-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 120px;
            height: 120px;
        }

        /* Multi-layered Animated Glows */
        .logo-glow-outer {
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--nx-accent-glow) 0%, transparent 65%);
            filter: blur(15px);
            animation: breatheOuter 6s infinite ease-in-out;
            pointer-events: none;
        }

        .logo-glow-inner {
            position: absolute;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
            filter: blur(8px);
            animation: breatheInner 3s infinite ease-in-out alternate;
            pointer-events: none;
        }

        /* The actual logo image */
        .logo-main {
            width: 90px;
            height: 90px;
            object-fit: contain;
            position: relative;
            z-index: 2;
            transform: translateZ(0) scale(0.8);
            opacity: 0;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.1));
            will-change: transform, opacity, filter;
            animation: cinematicEntrance 1.4s var(--nx-ease-spring) 0.1s forwards;
        }

        /* Typography & Taglines */
        .brand-typography {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .name-img {
            width: 180px;
            height: auto;
            object-fit: contain;
            opacity: 0;
            transform: translateY(24px) translateZ(0);
            will-change: transform, opacity;
            animation: fadeUpElevated 1s var(--nx-ease-out-expo) 0.4s forwards;
        }

        .tagline {
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 0.45em;
            text-transform: uppercase;
            color: var(--nx-text-secondary);
            opacity: 0;
            transform: translateY(20px) translateZ(0);
            text-align: center;
            width: 100%;
            text-indent: 0.45em; /* Compensate for letter spacing on last char */
            will-change: transform, opacity;
            animation: fadeUpElevated 1s var(--nx-ease-out-expo) 0.55s forwards;
            background: linear-gradient(90deg, var(--nx-text-secondary), #ffffff, var(--nx-text-secondary));
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: 
                fadeUpElevated 1s var(--nx-ease-out-expo) 0.55s forwards,
                shimmerText 5s linear infinite 2s;
        }

        /* ==========================================================================
           6. QUANTUM LOADER SYSTEM
           ========================================================================== */
        .loader-footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            width: 100%;
            opacity: 0;
            transform: translateY(15px);
            animation: fadeUpElevated 1s var(--nx-ease-out-expo) 0.8s forwards;
        }

        /* Status Output Terminal */
        .system-status {
            font-family: var(--nx-font-mono);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.1em;
            color: var(--nx-text-tertiary);
            text-transform: uppercase;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s ease;
        }

        .system-status.status-error {
            color: var(--nx-error);
        }

        /* Upgraded Kinetic Battery Loader */
        .quantum-loader-track {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--nx-accent-border-strong);
            border-radius: 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 
                0 4px 24px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
        }

        /* Reflection beneath loader */
        .quantum-loader-track::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 10%;
            width: 80%;
            height: 10px;
            background: inherit;
            filter: blur(8px);
            opacity: 0.3;
            transform: scaleY(-0.5);
            border-radius: 50%;
            pointer-events: none;
        }

        .loader-node {
            width: 6px;
            height: 16px;
            background: var(--nx-loader-bg);
            border-radius: 3px;
            transform-origin: center;
            transform: scaleY(0.3);
            will-change: transform, background-color, box-shadow;
            animation: quantumPulse 1.5s infinite var(--nx-ease-cinematic);
        }

        .loader-node:nth-child(1) { animation-delay: 0.0s; }
        .loader-node:nth-child(2) { animation-delay: 0.15s; }
        .loader-node:nth-child(3) { animation-delay: 0.30s; }
        .loader-node:nth-child(4) { animation-delay: 0.45s; }

        /* Loader error state */
        .quantum-loader-track.is-paused .loader-node {
            animation-play-state: paused;
            background: var(--nx-error-bg);
            box-shadow: none;
            transform: scaleY(0.3);
        }

        .footer-credit {
            font-size: 10px;
            color: var(--nx-text-tertiary);
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .footer-credit::before, .footer-credit::after {
            content: '';
            display: inline-block;
            width: 24px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--nx-text-tertiary), transparent);
            opacity: 0.3;
        }

        /* ==========================================================================
           7. MODALS & NOTIFICATION SYSTEM (OFFLINE/ERROR FALLBACK)
           ========================================================================== */
        .system-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(3, 3, 5, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: var(--z-modal);
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Mobile friendly bottom alignment */
            padding: 24px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s var(--nx-ease-cinematic);
        }

        .system-modal-overlay.is-active {
            opacity: 1;
            visibility: visible;
        }

        .system-modal-content {
            width: 100%;
            max-width: 400px;
            background: var(--nx-bg-surface-elevated);
            border: 1px solid var(--nx-accent-border-strong);
            border-radius: 24px;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 16px;
            transform: translateY(40px) scale(0.95);
            transition: all 0.5s var(--nx-ease-spring);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            margin-bottom: env(safe-area-inset-bottom, 16px);
        }

        .system-modal-overlay.is-active .system-modal-content {
            transform: translateY(0) scale(1);
        }

        .modal-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--nx-error-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--nx-error);
            margin-bottom: 8px;
        }

        .modal-icon svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--nx-text-primary);
            letter-spacing: -0.02em;
        }

        .modal-desc {
            font-size: 13px;
            line-height: 1.5;
            color: var(--nx-text-secondary);
        }

        .modal-btn {
            margin-top: 12px;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            background: var(--nx-text-primary);
            color: var(--nx-bg-base);
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .modal-btn:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        /* ==========================================================================
           8. ANIMATIONS & KEYFRAMES
           ========================================================================== */
        
        @keyframes cinematicEntrance {
            0% { opacity: 0; transform: scale(0.85) translateZ(0); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1) translateZ(0); filter: blur(0px); }
        }

        @keyframes fadeUpElevated {
            0% { opacity: 0; transform: translateY(24px) translateZ(0); filter: blur(4px); }
            100% { opacity: 1; transform: translateY(0) translateZ(0); filter: blur(0px); }
        }

        @keyframes breatheOuter {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.15); opacity: 0.9; }
        }

        @keyframes breatheInner {
            0% { transform: scale(0.9) rotate(0deg); opacity: 0.7; }
            100% { transform: scale(1.1) rotate(10deg); opacity: 1; }
        }

        @keyframes quantumPulse {
            0%, 100% { 
                transform: scaleY(0.3); 
                background: var(--nx-loader-bg); 
                box-shadow: none; 
            }
            50% { 
                transform: scaleY(1); 
                background: var(--nx-loader-fill); 
                box-shadow: 0 0 12px var(--nx-loader-fill), 0 0 4px var(--nx-loader-fill); 
            }
        }

        @keyframes shimmerText {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        /* Exit Transition Logic (Camera Push Effect) */
        .exit-camera-push {
            opacity: 0;
            transform: scale(1.1) translateZ(50px);
            filter: blur(12px) brightness(1.2);
            pointer-events: none;
        }

        /* ==========================================================================
           9. RESPONSIVE DESIGN & MEDIA QUERIES
           ========================================================================== */
        
        /* Landscape Mobile & Small Tablets */
        @media screen and (max-height: 500px) and (orientation: landscape) {
            .shell-container {
                padding: 16px;
                flex-direction: row;
                justify-content: space-around;
            }
            .brand-header {
                transform: none;
                flex: 0.6;
            }
            .loader-footer {
                flex: 0.4;
                justify-content: center;
            }
            .logo-wrapper {
                width: 80px; height: 80px;
            }
            .logo-main {
                width: 60px; height: 60px;
            }
            .name-img {
                width: 140px;
            }
            .system-modal-content {
                max-height: 90vh;
                overflow-y: auto;
                padding: 24px 20px;
            }
        }

        /* Desktop Optimization (Limits max width and frames it beautifully) */
        @media screen and (min-width: 768px) {
            .app-shell {
                background: rgba(3, 3, 5, 0.4);
            }
            .shell-container {
                max-width: 420px;
                height: 85vh;
                max-height: 850px;
                border-radius: 40px;
                background: var(--nx-bg-surface);
                border: 1px solid var(--nx-accent-border);
                box-shadow: 
                    0 25px 50px -12px rgba(0, 0, 0, 0.5),
                    0 0 0 1px rgba(255, 255, 255, 0.02) inset;
                overflow: hidden;
            }
            .system-modal-overlay {
                align-items: center; /* Center on desktop */
                background: rgba(3, 3, 5, 0.7);
            }
            .system-modal-content {
                border-radius: 24px;
                margin-bottom: 0;
            }
            /* Add an inner shadow to simulate device bezel */
            .shell-container::before {
                content: ''; position: absolute; inset: 0;
                border-radius: 40px;
                box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
                pointer-events: none; z-index: 50;
            }
        }

        /* Accessibility: Reduce Motion */
        @media (prefers-reduced-motion: reduce) {
            *, ::before, ::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
            .logo-glow-outer, .logo-glow-inner { display: none; }
            .grid-layer { display: none; }
            .quantum-loader-track { box-shadow: none; }
            .loader-node { transform: scaleY(0.7); background: var(--nx-loader-fill); }
            .exit-camera-push { transform: none; filter: none; }
        }

        /* Fallback for disabled JavaScript */
        .noscript-banner {
            position: fixed;
            top: 0; left: 0; width: 100%;
            background: var(--nx-error);
            color: #fff;
            text-align: center;
            padding: 12px;
            font-size: 13px;
            font-weight: 600;
            z-index: 9999;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <!-- Noscript Fallback -->
    <noscript>
        <div class="noscript-banner">
            JavaScript is required to access the NEXRA Ecosystem. Please enable it in your browser settings.
        </div>
    </noscript>

    <!-- Layer 1: Environment Engine -->
    <div class="ambient-core" aria-hidden="true"></div>
    <div class="grid-layer" aria-hidden="true"></div>
    <div class="noise-layer" aria-hidden="true"></div>
    <img src="assets/ui/watermark.png" class="brand-watermark" alt="" aria-hidden="true" loading="lazy" decoding="async">

    <!-- Layer 2: Main Application Shell -->
    <main class="app-shell" id="app-shell" aria-live="polite" aria-busy="true">
        <div class="shell-container">
            
            <!-- Branding Header Section -->
            <header class="brand-header">
                <div class="logo-wrapper">
                    <div class="logo-glow-outer" aria-hidden="true"></div>
                    <div class="logo-glow-inner" aria-hidden="true"></div>
                    <img src="assets/ui/logo.png" alt="NEXRA Logo Symbol" class="logo-main" fetchpriority="high">
                </div>
                
                <div class="brand-typography">
                    <img src="assets/ui/title-text.png" alt="NEXRA" class="name-img" fetchpriority="high">
                    <h1 class="tagline">Smart Earning Ecosystem</h1>
                </div>
            </header>

            <!-- Loading & Status Footer Section -->
            <footer class="loader-footer">
                <div class="system-status" id="system-status" aria-atomic="true">
                    INITIALIZING CORE MODULES...
                </div>
                
                <div class="quantum-loader-track" id="loader-track" aria-label="Loading application environment">
                    <div class="loader-node"></div>
                    <div class="loader-node"></div>
                    <div class="loader-node"></div>
                    <div class="loader-node"></div>
                </div>
                
                <p class="footer-credit">Powered by NEXRA Community</p>
            </footer>
        </div>
    </main>

    <!-- Layer 3: System Modals (Network Error / Initialization Failure) -->
    <div class="system-modal-overlay" id="error-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-desc">
        <div class="system-modal-content">
            <div class="modal-icon">
                <!-- Feather Icon: Wifi-Off -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="2" y1="2" x2="22" y2="22"></line>
                    <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                    <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                    <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                    <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                    <line x1="12" y1="20" x2="12.01" y2="20"></line>
                </svg>
            </div>
            <h2 class="modal-title" id="modal-title">Connection Lost</h2>
            <p class="modal-desc" id="modal-desc">NEXRA requires an active network connection to securely synchronize ecosystem data. Please check your internet connection.</p>
            <button class="modal-btn" id="btn-retry" type="button">
                <!-- Feather Icon: Refresh-Cw -->
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
                Retry Connection
            </button>
        </div>
    </div>

    <!-- Application Initialization Logic -->
    <script type="module">
        // ==========================================================================
        // 1. FIREBASE INTEGRATION (STRICTLY PRESERVED)
        // ==========================================================================
        import { db, doc, getDoc, auth, onAuthStateChanged } from "./assets/js/firebase-config.js";

        // ==========================================================================
        // 2. STATE MANAGEMENT & GLOBALS
        // ==========================================================================
        const AppState = {
            capturedUser: null,
            isAuthResolved: false,
            isNetworkOnline: navigator.onLine,
            isBooting: true,
            authUnsubscribe: null,
            statusInterval: null
        };

        const Config = {
            MIN_SPLASH_TIME_MS: 3200, // Slightly extended for cinematic feel & UX pacing
            EXIT_ANIM_DURATION_MS: 900, // Matches CSS transition exactly
            MAINTENANCE_DOC_PATH: ["settings", "app"]
        };

        const DOM = {
            shell: document.getElementById('app-shell'),
            statusText: document.getElementById('system-status'),
            loaderTrack: document.getElementById('loader-track'),
            errorModal: document.getElementById('error-modal'),
            btnRetry: document.getElementById('btn-retry'),
            modalTitle: document.getElementById('modal-title'),
            modalDesc: document.getElementById('modal-desc')
        };

        // ==========================================================================
        // 3. BOOTSTRAPPER SYSTEM
        // ==========================================================================
        class NexraBootstrapper {
            
            /**
             * Initialize the application boot sequence
             */
            static async start() {
                // 1. Immediately attach Firebase observer to pre-warm state (Preserved Logic)
                AppState.authUnsubscribe = onAuthStateChanged(auth, (user) => {
                    AppState.capturedUser = user;
                    AppState.isAuthResolved = true;
                });

                // 2. Setup Event Listeners for network resilience
                this.setupNetworkMonitors();

                // 3. Start dynamic UI feedback
                this.cycleStatusMessages();

                // 4. Begin Core Initialization Race
                const startTime = Date.now();
                
                try {
                    if (!AppState.isNetworkOnline) {
                        throw new Error("OFFLINE");
                    }

                    // Parallel Loading: Check maintenance while waiting for auth (Preserved Logic)
                    // Added a timeout to prevent hanging forever on bad networks
                    const maintenanceCheck = this.fetchMaintenanceStatusWithTimeout(10000);
                    const isMaintenance = await maintenanceCheck;

                    // Calculate remaining time to satisfy MIN_SPLASH_TIME_MS
                    const elapsedTime = Date.now() - startTime;
                    const remainingDelay = Math.max(0, Config.MIN_SPLASH_TIME_MS - elapsedTime);

                    // Proceed to routing after cinematic delay
                    setTimeout(() => {
                        this.executeRoutingSequence(isMaintenance);
                    }, remainingDelay);

                } catch (error) {
                    console.error("[NEXRA BOOT ERROR]:", error);
                    
                    // Stop cyclic messages
                    if (AppState.statusInterval) clearInterval(AppState.statusInterval);
                    
                    if (error.message === "OFFLINE" || !AppState.isNetworkOnline) {
                        this.triggerSystemFault("OFFLINE");
                    } else {
                        // Generic Firestore/System Failure (Safe Fallback Preserved)
                        this.triggerSystemFault("SYSTEM_ERROR");
                    }
                }
            }

            /**
             * Fetches maintenance doc with a built-in timeout to prevent infinite loaders
             */
            static async fetchMaintenanceStatusWithTimeout(timeoutMs) {
                return new Promise((resolve, reject) => {
                    const timer = setTimeout(() => reject(new Error("TIMEOUT")), timeoutMs);
                    
                    getDoc(doc(db, Config.MAINTENANCE_DOC_PATH[0], Config.MAINTENANCE_DOC_PATH[1]))
                        .then((snap) => {
                            clearTimeout(timer);
                            resolve(snap.exists() ? snap.data().maintenance : false);
                        })
                        .catch((err) => {
                            clearTimeout(timer);
                            reject(err);
                        });
                });
            }

            /**
             * Handles the final redirect logic (Preserved original logic exactly)
             */
            static executeRoutingSequence(isMaintenance) {
                // Clean up listener for performance
                if (AppState.authUnsubscribe) AppState.authUnsubscribe();

                DOM.statusText.textContent = "SYNCHRONIZATION COMPLETE";
                DOM.statusText.style.color = "var(--nx-text-primary)";

                // Trigger cinematic exit
                DOM.shell.classList.add('exit-camera-push');
                DOM.shell.setAttribute('aria-busy', 'false');

                // Wait for CSS animation to finish before actual redirect
                setTimeout(() => {
                    if (isMaintenance) {
                        window.location.replace('auth/checkpoint.html');
                        return;
                    }

                    const routeUser = (user) => {
                        if (user) {
                            window.location.replace('auth/checkpoint.html');
                        } else {
                            const hasVisited = localStorage.getItem('nexra_onboarded');
                            if (!hasVisited) {
                                localStorage.setItem('nexra_onboarded', 'true');
                                window.location.replace('intro.html');
                            } else {
                                window.location.replace('auth/login.html');
                            }
                        }
                    };

                    // Use pre-warmed state or fetch immediately if slow network
                    if (AppState.isAuthResolved) {
                        routeUser(AppState.capturedUser);
                    } else {
                        onAuthStateChanged(auth, routeUser);
                    }
                }, Config.EXIT_ANIM_DURATION_MS);
            }

            // ==========================================================================
            // 4. UI & UX FEEDBACK ENHANCEMENTS
            // ==========================================================================

            /**
             * Cycles high-tech status messages to maintain user engagement
             */
            static cycleStatusMessages() {
                const messages = [
                    "INITIALIZING CORE MODULES...",
                    "ESTABLISHING SECURE CONNECTION...",
                    "VERIFYING CRYPTOGRAPHIC KEYS...",
                    "SYNCING ECOSYSTEM DATA...",
                    "FINALIZING SECURE SESSION..."
                ];
                let currentIndex = 0;

                AppState.statusInterval = setInterval(() => {
                    if (currentIndex < messages.length - 1 && AppState.isBooting && AppState.isNetworkOnline) {
                        currentIndex++;
                        // Add fade effect for text change
                        DOM.statusText.style.opacity = 0;
                        setTimeout(() => {
                            DOM.statusText.textContent = messages[currentIndex];
                            DOM.statusText.style.opacity = 1;
                        }, 200);
                    }
                }, 800);
            }

            /**
             * Gracefully handles errors by presenting a premium modal instead of silent fails
             */
            static triggerSystemFault(reason) {
                AppState.isBooting = false;
                DOM.loaderTrack.classList.add('is-paused');
                DOM.statusText.classList.add('status-error');
                
                if (reason === "OFFLINE") {
                    DOM.statusText.textContent = "NETWORK CONNECTION LOST";
                    DOM.modalTitle.textContent = "Connection Lost";
                    DOM.modalDesc.textContent = "NEXRA requires an active network connection to securely synchronize ecosystem data. Please check your internet connection.";
                } else {
                    DOM.statusText.textContent = "SYSTEM FAULT DETECTED";
                    DOM.modalTitle.textContent = "Service Unavailable";
                    DOM.modalDesc.textContent = "We are currently experiencing difficulties connecting to the secure servers. Please try again in a moment.";
                }

                // Show Modal smoothly
                setTimeout(() => {
                    DOM.errorModal.classList.add('is-active');
                    DOM.btnRetry.focus();
                }, 400);
            }

            /**
             * Restores UI after a successful retry
             */
            static clearSystemFault() {
                DOM.errorModal.classList.remove('is-active');
                DOM.loaderTrack.classList.remove('is-paused');
                DOM.statusText.classList.remove('status-error');
                DOM.statusText.textContent = "RE-ESTABLISHING CONNECTION...";
                AppState.isBooting = true;
                
                // Restart boot sequence
                setTimeout(() => this.start(), 600);
            }

            /**
             * Sets up resilient network monitoring
             */
            static setupNetworkMonitors() {
                window.addEventListener('online', () => {
                    AppState.isNetworkOnline = true;
                    if (!AppState.isBooting) {
                        this.clearSystemFault();
                    }
                });

                window.addEventListener('offline', () => {
                    AppState.isNetworkOnline = false;
                    this.triggerSystemFault("OFFLINE");
                });

                DOM.btnRetry.addEventListener('click', () => {
                    if (navigator.onLine) {
                        AppState.isNetworkOnline = true;
                        this.clearSystemFault();
                    } else {
                        // Provide button feedback even if still offline
                        DOM.btnRetry.style.transform = 'scale(0.95)';
                        setTimeout(() => DOM.btnRetry.style.transform = 'none', 150);
                    }
                });
            }
        }

        // ==========================================================================
        // 5. APPLICATION ENTRY POINT
        // ==========================================================================
        const bootNEXRA = () => {
            // Prevent double initialization
            if (window.nexraBooted) return;
            window.nexraBooted = true;
            
            NexraBootstrapper.start();
        };

        // Initialize exactly when DOM is ready
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", bootNEXRA);
        } else {
            bootNEXRA();
        }
    </script>
</body>
</html>
