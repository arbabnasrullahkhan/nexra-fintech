<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- ==========================================
         SEO, METADATA & OPEN GRAPH IDENTITY
         ========================================== -->
    <title>NEXRA | Smart Earning Ecosystem</title>
    <meta name="description" content="Join NEXRA, the world's most secure and advanced fintech earning ecosystem. Experience next-generation digital wealth generation.">
    <meta name="keywords" content="NEXRA, Earning Ecosystem, Fintech, Secure Finance, Smart Earning, Web3, Digital Ecosystem">
    <meta name="author" content="NEXRA Community">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="theme-color" content="#050507">
    <meta name="color-scheme" content="dark">
    <link rel="canonical" href="https://nexra.app/"> <!-- Update domain when live -->

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="NEXRA">
    <meta property="og:title" content="NEXRA | Smart Earning Ecosystem">
    <meta property="og:description" content="Join the world's most secure and advanced fintech earning ecosystem.">
    <meta property="og:image" content="assets/ui/logo.png">
    <meta property="og:url" content="https://nexra.app/">
    <meta property="og:locale" content="en_US">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="NEXRA | Smart Earning Ecosystem">
    <meta name="twitter:description" content="Join the world's most secure and advanced fintech earning ecosystem.">
    <meta name="twitter:image" content="assets/ui/logo.png">

    <!-- Apple & PWA Mobile Web App Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NEXRA">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="NEXRA">
    <meta name="msapplication-TileColor" content="#050507">
    <meta name="msapplication-navbutton-color" content="#050507">

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "NEXRA",
      "operatingSystem": "All",
      "applicationCategory": "FinanceApplication",
      "description": "Smart Earning Ecosystem providing next-generation digital wealth solutions.",
      "publisher": {
        "@type": "Organization",
        "name": "NEXRA Community"
      }
    }
    </script>

    <!-- ==========================================
         PRELOADING CRITICAL ASSETS
         ========================================== -->
    <link rel="icon" type="image/png" href="assets/ui/favicon.png">
    <link rel="apple-touch-icon" href="assets/ui/favicon.png">
    
    <!-- Preload UI Assets for Instant Rendering -->
    <link rel="preload" as="image" href="assets/ui/logo.png" fetchpriority="high">
    <link rel="preload" as="image" href="assets/ui/title-text.png" fetchpriority="high">
    <link rel="preload" as="image" href="assets/ui/watermark.png" fetchpriority="low">

    <!-- Preload Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- ==========================================
         CORE DESIGN SYSTEM & STYLES
         ========================================== -->
    <style>
        /* --- DESIGN TOKENS --- */
        :root {
            --brand-bg: #050507; /* Deepest obsidian */
            --brand-surface: #0a0a0e;
            --brand-glow: rgba(255, 255, 255, 0.04);
            --brand-accent: rgba(255, 255, 255, 0.85);
            
            --grid-color: rgba(255, 255, 255, 0.025);
            --grid-size: 32px;
            
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --text-muted: #52525b;
            
            --loader-bg: rgba(255, 255, 255, 0.05);
            --loader-fill: #ffffff;
            --loader-glow: rgba(255, 255, 255, 0.4);
            
            --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-in-out-circ: cubic-bezier(0.785, 0.135, 0.15, 0.86);
            
            --safe-area-top: env(safe-area-inset-top, 20px);
            --safe-area-bottom: env(safe-area-inset-bottom, 20px);
        }

        /* --- BASE RESET & SETUP --- */
        *, *::before, *::after { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        html, body {
            width: 100%; 
            height: 100%;
            height: 100dvh; 
            overflow: hidden !important;
            position: fixed;
            background-color: var(--brand-bg);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            touch-action: none; 
            user-select: none;
            -webkit-user-drag: none;
            color: var(--text-primary);
            display: flex; 
            justify-content: center; 
            align-items: center;
            overscroll-behavior: none;
        }

        /* --- AMBIENT BACKGROUND SYSTEM --- */
        .ambient-canvas {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
            background: radial-gradient(circle at 50% 30%, var(--brand-glow) 0%, transparent 60%),
                        radial-gradient(circle at 50% 90%, rgba(255, 255, 255, 0.015) 0%, transparent 50%);
        }

        /* Precision Grid Overlay */
        .ambient-grid {
            position: absolute;
            inset: -50%;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: var(--grid-size) var(--grid-size);
            background-position: center;
            mask-image: radial-gradient(ellipse at center, black 10%, transparent 60%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 10%, transparent 60%);
            transform: perspective(1000px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 20s linear infinite;
            opacity: 0.8;
        }

        /* Noise Texture for Premium Matte Finish */
        .ambient-noise {
            position: absolute;
            inset: 0;
            z-index: 2;
            opacity: 0.035;
            mix-blend-mode: overlay;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* --- BRAND PRESERVATION: WATERMARK --- */
        .brand-watermark {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.015;
            pointer-events: none;
            z-index: 3;
            mix-blend-mode: screen;
            filter: grayscale(100%) contrast(120%);
        }

        /* --- MAIN APPLICATION SHELL --- */
        .splash-shell {
            position: relative; 
            z-index: 10;
            width: 100%; 
            max-width: 480px;
            height: 100%; 
            display: flex;
            flex-direction: column; 
            justify-content: space-between;
            align-items: center; 
            padding: max(8dvh, var(--safe-area-top)) 32px max(6dvh, var(--safe-area-bottom));
            transition: opacity 0.8s var(--ease-out-expo), transform 0.8s var(--ease-out-expo), filter 0.8s var(--ease-out-expo);
        }

        /* Header / Brand Group */
        .brand-group { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            width: 100%;
            gap: 32px;
        }

        /* Logo Configuration */
        .logo-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Multi-layered cinematic glow */
        .logo-glow {
            position: absolute;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.02) 40%, transparent 70%);
            border-radius: 50%;
            filter: blur(16px);
            animation: pulseGlow 4s var(--ease-in-out-circ) infinite alternate;
            pointer-events: none;
            z-index: 1;
        }

        .logo-glow-inner {
            position: absolute;
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
            border-radius: 50%;
            filter: blur(8px);
            z-index: 2;
        }

        .logo-main { 
            width: 100px; 
            height: 100px; 
            object-fit: contain; 
            position: relative; 
            z-index: 5;
            transform: scale(0.85) translateZ(0);
            opacity: 0;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4));
            will-change: transform, opacity, filter;
            animation: cinematicReveal 1.2s var(--ease-spring) 0.1s forwards,
                       floating 6s ease-in-out 1.3s infinite;
        }

        /* Typography & Identity */
        .identity-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 5;
        }

        .name-img { 
            width: clamp(160px, 45vw, 195px); 
            height: auto; 
            object-fit: contain; 
            transform: translateY(24px) scale(0.95); 
            opacity: 0;
            will-change: transform, opacity;
            animation: fadeUpReveal 0.9s var(--ease-out-expo) 0.4s forwards; 
        }

        .tagline-wrapper {
            overflow: hidden;
            padding: 4px 0;
        }

        .tagline { 
            font-size: clamp(10px, 2.8vw, 12px); 
            font-weight: 600; 
            letter-spacing: 0.45em; 
            text-transform: uppercase; 
            color: var(--text-secondary);
            transform: translateY(100%); 
            opacity: 0;
            will-change: transform, opacity;
            animation: slideUpReveal 0.8s var(--ease-out-expo) 0.6s forwards; 
            text-align: center;
            white-space: nowrap;
        }

        /* --- FOOTER & LOADER SYSTEM --- */
        .loader-group { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 24px; 
            width: 100%;
            position: relative;
            z-index: 5;
        }

        /* High-end glassmorphic kinetic tracker */
        .system-loader { 
            display: flex; 
            gap: 6px; 
            align-items: center; 
            justify-content: center;
            height: 36px; 
            padding: 0 16px;
            background: rgba(25, 25, 30, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            opacity: 0;
            transform: translateY(15px);
            animation: fadeUpReveal 0.8s var(--ease-out-expo) 0.8s forwards;
        }

        .system-track {
            display: flex;
            gap: 5px;
            align-items: center;
            height: 100%;
        }

        .track-node { 
            width: 6px; 
            height: 6px; 
            background: var(--loader-bg); 
            border-radius: 50%; 
            will-change: transform, background-color, box-shadow;
            animation: nodePulse 1.5s infinite var(--ease-in-out-circ); 
        }
        
        .track-node:nth-child(1) { animation-delay: 0.0s; }
        .track-node:nth-child(2) { animation-delay: 0.15s; }
        .track-node:nth-child(3) { animation-delay: 0.3s; }
        .track-node:nth-child(4) { animation-delay: 0.45s; }

        /* Status Text Updates */
        .status-text {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            height: 14px; /* Fixed height to prevent layout shift */
            opacity: 0;
            animation: fadeIn 0.5s ease 1s forwards;
        }

        /* Footer Credits */
        .footer-credit { 
            font-size: 11px; 
            color: rgba(255, 255, 255, 0.3); 
            font-weight: 600; 
            letter-spacing: 1.5px; 
            text-transform: uppercase;
            display: flex; 
            align-items: center; 
            gap: 10px;
            opacity: 0;
            animation: fadeUpReveal 0.8s var(--ease-out-expo) 1s forwards;
        }

        .footer-credit::before, .footer-credit::after {
            content: '';
            display: inline-block;
            width: 24px; 
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
        }

        /* --- ANIMATION KEYFRAMES --- */
        @keyframes gridMove {
            0% { transform: perspective(1000px) rotateX(60deg) translateY(0) translateZ(-200px); }
            100% { transform: perspective(1000px) rotateX(60deg) translateY(64px) translateZ(-200px); } /* 64px is 2x grid size */
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        @keyframes cinematicReveal { 
            0% { opacity: 0; transform: scale(0.85) translateZ(0); filter: blur(10px); } 
            100% { opacity: 1; transform: scale(1) translateZ(0); filter: blur(0); } 
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0) translateZ(0); }
            50% { transform: translateY(-6px) translateZ(0); }
        }
        
        @keyframes fadeUpReveal { 
            from { opacity: 0; transform: translateY(24px) scale(0.98); filter: blur(4px); } 
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } 
        }

        @keyframes slideUpReveal { 
            from { opacity: 0; transform: translateY(100%); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes nodePulse { 
            0%, 100% { 
                transform: scale(1); 
                background: var(--loader-bg); 
                box-shadow: none; 
            } 
            50% { 
                transform: scale(1.5); 
                background: var(--loader-fill); 
                box-shadow: 0 0 10px var(--loader-glow); 
            } 
        }

        /* --- STATE TRANSITIONS --- */
        .exit-effect { 
            opacity: 0 !important; 
            transform: scale(1.04) translateY(-10px) !important; 
            filter: blur(12px) !important; 
            pointer-events: none;
        }

        /* Screen Reader Only Utility */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* --- ACCESSIBILITY: REDUCED MOTION --- */
        @media (prefers-reduced-motion: reduce) {
            *, ::before, ::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
            .ambient-grid { animation: none; }
            .logo-main { animation: none; opacity: 1; transform: none; filter: none; }
            .name-img, .tagline, .system-loader, .footer-credit, .status-text { 
                animation: none; opacity: 1; transform: none; filter: none; 
            }
            .logo-glow { animation: none; opacity: 0.8; }
            .track-node { animation: none; background: var(--loader-fill); }
            .exit-effect { filter: none; transform: none; }
        }

        /* --- RESPONSIVE ADJUSTMENTS --- */
        @media (min-width: 768px) {
            .splash-shell { padding: 10dvh 40px; max-width: 600px; }
            .logo-main { width: 120px; height: 120px; }
            .name-img { width: 220px; }
            .tagline { font-size: 13px; }
        }
    </style>
</head>
<body>

    <!-- Semantic Screen Reader Announcement Area -->
    <div aria-live="polite" aria-atomic="true" class="sr-only" id="sr-announcer">
        Initializing NEXRA Smart Earning Ecosystem...
    </div>

    <!-- Background Environment -->
    <div class="ambient-canvas" aria-hidden="true">
        <div class="ambient-grid"></div>
    </div>
    <div class="ambient-noise" aria-hidden="true"></div>
    
    <!-- Preserved Watermark Integration -->
    <img src="assets/ui/watermark.png" class="brand-watermark" alt="" aria-hidden="true" draggable="false">

    <!-- Application UI Shell -->
    <main class="splash-shell" id="app-shell" role="main">
        
        <header class="brand-group">
            <div class="logo-container">
                <div class="logo-glow" aria-hidden="true"></div>
                <div class="logo-glow-inner" aria-hidden="true"></div>
                <img src="assets/ui/logo.png" alt="NEXRA Logo" class="logo-main" id="brand-logo" loading="eager" decoding="async" draggable="false">
            </div>
            
            <div class="identity-group">
                <img src="assets/ui/title-text.png" alt="NEXRA" class="name-img" loading="eager" decoding="async" draggable="false">
                <div class="tagline-wrapper">
                    <h1 class="tagline">Smart Earning Ecosystem</h1>
                </div>
            </div>
        </header>

        <footer class="loader-group">
            <div class="system-loader" role="progressbar" aria-label="Loading application securely" aria-valuemin="0" aria-valuemax="100">
                <div class="system-track">
                    <div class="track-node"></div>
                    <div class="track-node"></div>
                    <div class="track-node"></div>
                    <div class="track-node"></div>
                </div>
            </div>
            
            <p class="status-text" id="boot-status" aria-hidden="true">Establishing secure connection...</p>
            
            <p class="footer-credit">Powered by NEXRA Community</p>
        </footer>
        
    </main>

    <!-- ==========================================
         APPLICATION BOOTLOADER LOGIC
         ========================================== -->
    <script type="module">
        // 1. EXACT PRESERVATION OF FIREBASE IMPORTS
        import { db, doc, getDoc, auth, onAuthStateChanged } from "./assets/js/firebase-config.js";

        /**
         * SystemBootloader Class
         * Manages the strict application entry sequence, ensuring minimum splash time 
         * for brand presence, fetching maintenance status, and handling auth routing safely.
         */
        class SystemBootloader {
            constructor() {
                // Core Elements
                this.shell = document.getElementById('app-shell');
                this.statusText = document.getElementById('boot-status');
                this.srAnnouncer = document.getElementById('sr-announcer');
                
                // State Architecture
                this.capturedUser = null;
                this.isAuthResolved = false;
                this.isMaintenance = false;
                this.hasError = false;
                
                // Timing Configurations (in ms)
                this.SPLASH_MIN_TIME = 3200; // Optimal for cinematic animations
                this.EXIT_ANIM_TIME = 800; // Matches --ease-out-expo CSS transition
                
                this.startTime = Date.now();
                
                // Status Update Sequence Messages
                this.statusMessages = [
                    "Establishing secure connection...",
                    "Verifying encryption protocols...",
                    "Loading ecosystem data...",
                    "Ready."
                ];
            }

            /**
             * Initialize the sequence immediately
             */
            async boot() {
                this.cycleStatusMessages();
                this.attachAuthListener();
                
                try {
                    // Parallel Execution: Fetch config while waiting for Auth resolution
                    await this.fetchSystemSettings();
                } catch (error) {
                    console.error("[NEXRA Bootloader] System Config Error:", error);
                    this.hasError = true;
                }

                this.finalizeBootSequence();
            }

            /**
             * Attaches the Firebase Auth Listener to pre-warm the state
             */
            attachAuthListener() {
                this.unsubscribeAuth = onAuthStateChanged(auth, (user) => {
                    this.capturedUser = user;
                    this.isAuthResolved = true;
                });
            }

            /**
             * Fetches maintenance mode settings from Firestore
             */
            async fetchSystemSettings() {
                try {
                    const settingsRef = doc(db, "settings", "app");
                    const settingsSnap = await getDoc(settingsRef);
                    
                    if (settingsSnap.exists()) {
                        const data = settingsSnap.data();
                        this.isMaintenance = data.maintenance === true;
                    }
                } catch (err) {
                    throw new Error("Firestore connection timeout/failure");
                }
            }

            /**
             * Cycles minor status text to give feeling of active progression
             */
            cycleStatusMessages() {
                let step = 0;
                this.messageInterval = setInterval(() => {
                    step++;
                    if (step < this.statusMessages.length - 1) {
                        this.updateStatus(this.statusMessages[step]);
                    } else {
                        clearInterval(this.messageInterval);
                    }
                }, 900);
            }

            /**
             * Updates visual status and Screen Reader announcement
             */
            updateStatus(msg) {
                if(this.statusText) {
                    // Slight fade effect for text change
                    this.statusText.style.opacity = '0';
                    setTimeout(() => {
                        this.statusText.textContent = msg;
                        this.statusText.style.opacity = '1';
                    }, 200);
                }
                if(this.srAnnouncer) this.srAnnouncer.textContent = msg;
            }

            /**
             * Ensures minimum viewing time is respected, then executes exit
             */
            finalizeBootSequence() {
                const elapsedTime = Date.now() - this.startTime;
                const remainingTime = Math.max(0, this.SPLASH_MIN_TIME - elapsedTime);

                setTimeout(() => {
                    this.updateStatus(this.statusMessages[this.statusMessages.length - 1]); // "Ready."
                    this.triggerExit();
                }, remainingTime);
            }

            /**
             * Triggers CSS exit animation and executes routing logic
             */
            triggerExit() {
                if (this.shell) {
                    this.shell.classList.add('exit-effect');
                }
                
                // Wait for the exit animation to physically finish before redirecting
                setTimeout(() => {
                    this.executeRoutingLogic();
                }, this.EXIT_ANIM_TIME);
            }

            /**
             * Core Routing Logic (Strictly Preserved)
             */
            executeRoutingLogic() {
                // Clean up memory
                if (this.unsubscribeAuth) this.unsubscribeAuth();
                if (this.messageInterval) clearInterval(this.messageInterval);

                // 1. Fallback routing on critical failure
                if (this.hasError) {
                    console.warn("[NEXRA Bootloader] Boot error detected. Falling back to login.");
                    window.location.replace('auth/login.html');
                    return;
                }

                // 2. Maintenance Routing
                if (this.isMaintenance) {
                    window.location.replace('auth/checkpoint.html');
                    return;
                }

                // Helper Router based on User Object
                const routeUser = (user) => {
                    if (user) {
                        window.location.replace('auth/checkpoint.html');
                    } else {
                        const hasVisited = localStorage.getItem('nexra_onboarded');
                        if (!hasVisited) {
                            localStorage.setItem('nexra_onboarded', 'true');
                            window.location.replace('intro.html');
                        } else {
                            window.location.replace('auth/login.html');
                        }
                    }
                };

                // 3. Process Auth State
                if (this.isAuthResolved) {
                    routeUser(this.capturedUser);
                } else {
                    // Ultimate safety fallback if Auth is extremely slow
                    onAuthStateChanged(auth, routeUser);
                }
            }
        }

        // ==========================================
        // INITIALIZATION TRIGGER
        // ==========================================
        const startApp = () => {
            const bootloader = new SystemBootloader();
            bootloader.boot();
        };

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", startApp);
        } else {
            startApp();
        }
    </script>
</body>
</html>
